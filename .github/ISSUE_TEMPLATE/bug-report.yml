name: Bug report or support question
description: Report a test2task issue using a synthetic or redacted example.
title: '[Support] '
body:
  - type: markdown
    attributes:
      value: 'This tracker is public. Do not include passwords, tokens, Authorization headers, private Jira URLs, unredacted logs, storage snapshots, or confidential screenshots/video. For a privacy question, request a private contact channel without posting sensitive details.'
  - type: input
    id: versions
    attributes:
      label: Extension and Chrome versions
      placeholder: 'test2task 0.1.0 / Chrome version'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected feature
      options:
        - Screenshot or annotation
        - Network and console recording
        - Screen video or GIF
        - Jira connection or issue creation
        - Attachments
        - Settings or popup layout
        - Privacy question
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and result
      description: Describe steps, expected behavior, actual behavior, and a sanitized error message. Use fictional data and omit private hostnames.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public information check
      options:
        - label: I have removed credentials, personal information, private URLs, and confidential captured data.
          required: true
